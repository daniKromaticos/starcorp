name: Validar reglas de Eslint
on:
  pull_request:
    branches:
      - main
      - dev
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Instalar dependencias
        run: npm ci
      - name: Validar reglas de Eslint
        run: npx eslint .
